  <text x="74" y="214" fill="#57e3c3" font-family="Segoe UI,Arial,sans-serif" font-size="26" font-weight="650">Construyo soluciones digitales.</text>
  <text x="74" y="269" fill="#becde0" font-family="Segoe UI,Arial,sans-serif" font-size="19">Aplicaciones web · Sistemas de negocio · Automatización · Infraestructura</text>
  <path d="M74 314h510" stroke="url(#highlight)" stroke-opacity=".75" stroke-width="2"/>
  <text x="74" y="338" fill="#91a7bd" font-family="Segoe UI,Arial,sans-serif" font-size="12" letter-spacing="1.2">PROYECTOS REALES · CÓDIGO · CAPTURAS</text>
