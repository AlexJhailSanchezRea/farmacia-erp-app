<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title description">
  <title id="title">Alex Jhail Sánchez Rea — Portafolio de software</title>
  <desc id="description">Desarrollo de software, aplicaciones web, automatización e infraestructura tecnológica.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071521"/>
      <stop offset="0.56" stop-color="#102b3b"/>
      <stop offset="1" stop-color="#172148"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#57e3c3"/>
      <stop offset="1" stop-color="#77a8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(1040 45) rotate(120) scale(360 510)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#57e3c3" stop-opacity=".2"/>
      <stop offset="1" stop-color="#57e3c3" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#c6e2ff" stroke-opacity=".055" stroke-width="1"/>
