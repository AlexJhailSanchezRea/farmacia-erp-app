  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#background)"/>
  <rect width="1280" height="360" rx="28" fill="url(#glow)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="150" r="186" fill="none" stroke="#71ebd2" stroke-opacity=".16" stroke-width="1.5"/>
  <circle cx="1090" cy="150" r="136" fill="none" stroke="#71ebd2" stroke-opacity=".13" stroke-width="1.5"/>
  <circle cx="1090" cy="150" r="86" fill="#57e3c3" fill-opacity=".08" stroke="#71ebd2" stroke-opacity=".2"/>
  <path d="M1012 152h37l20-32 28 62 21-30h50" fill="none" stroke="url(#highlight)" stroke-linecap="round" stroke-linejoin="round" stroke-width="4"/>
  <circle cx="1012" cy="152" r="4" fill="#57e3c3"/>
  <circle cx="1168" cy="152" r="4" fill="#77a8ff"/>
  <rect x="72" y="62" width="10" height="10" rx="5" fill="#57e3c3"/>
